spring:
  application:
    name: notification-agent

server:
  port: ${NOTIFICATION_AGENT_PORT:8090}

shrija:
  ai:
    gemini-api-key: ${GOOGLE_API_KEY}
    gemini-model: ${NOTIFICATION_GEMINI_MODEL:gemini-3.1-flash-lite}
    mcp-server-url: ${NOTIFICATION_MCP_SERVER_URL:http://localhost:8082}

ai:
  a2a:
    server:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.shrija.notification: INFO
    com.google.adk: INFO
