name: hrms-production

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - hrms_mysql_data:/var/lib/mysql
    networks:
      - hrms-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15

  mcp:
    image: ${MCP_IMAGE:?MCP_IMAGE is required}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?GOOGLE_API_KEY is required}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hrms-network

  auth:
    image: ${AUTH_IMAGE:?AUTH_IMAGE is required}
    restart: unless-stopped
    environment:
      AUTH_SERVICE_PORT: 8081
      HRMS_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      HRMS_DATASOURCE_USERNAME: ${MYSQL_USER}
      HRMS_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_SEED_ADMIN_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hrms-network

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?GOOGLE_API_KEY is required}
      EMPLOYEE_AGENT_A2A_URL: ${EMPLOYEE_AGENT_A2A_URL}
    depends_on:
      mcp:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - hrms-network

volumes:
  hrms_mysql_data:

networks:
  hrms-network:
