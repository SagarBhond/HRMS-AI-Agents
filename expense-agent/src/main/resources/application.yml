spring:
  application:
    name: expense-agent

server:
  port: ${EXPENSE_AGENT_PORT:8092}

shrija:
  ai:
    gemini-api-key: ${GOOGLE_API_KEY}
    gemini-model: ${EXPENSE_GEMINI_MODEL:gemini-3.1-flash-lite}
    mcp-server-url: ${EXPENSE_MCP_SERVER_URL:http://localhost:8082}

ai:
  a2a:
    server:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.shrija.expense: INFO
    com.google.adk: INFO
