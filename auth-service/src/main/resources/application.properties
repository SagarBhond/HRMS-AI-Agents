server.port=${AUTH_SERVICE_PORT:8081}

# --- Shared HRMS MySQL database ---
# Same physical database the MCP server (hrms-mcp-server) uses, so auth_user
# rows can be joined against employee/attendance/payroll/leave data by employee_id.
# This is what makes "one shared DB across all agents" (from the ERD) real.
spring.datasource.url=${HRMS_DATASOURCE_URL:jdbc:mysql://localhost:3306/hrms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${HRMS_DATASOURCE_USERNAME:root}
spring.datasource.password=${HRMS_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# IMPORTANT: use 'update', never 'create-drop' / 'create' here.
# The MCP server owns employee/attendance/leave_request/salary_slip/etc in this
# same schema — 'update' only adds/adjusts tables this service's own entities
# map to (auth_user). It will NOT touch or wipe the other agents' tables.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${HRMS_SHOW_SQL:false}
spring.jpa.open-in-view=false

# H2 console no longer applicable (kept off; H2 is now test-scope only)
spring.h2.console.enabled=false

# --- JWT ---
# 256-bit+ secret. Replace with an env var / secrets manager value in production.
# MUST be the same value the MCP server / orchestrator use if they verify this token.
jwt.secret=${JWT_SECRET:MyLocalHRMSJwtSecretKey2026SecureValue123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# The only account created automatically. Override these values outside local development.
auth.seed-admin.enabled=${AUTH_SEED_ADMIN_ENABLED:true}
auth.seed-admin.username=${AUTH_SEED_ADMIN_USERNAME:admin@gmail.com}
auth.seed-admin.password=${AUTH_SEED_ADMIN_PASSWORD:password123}
