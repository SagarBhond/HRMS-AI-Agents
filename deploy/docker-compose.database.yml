name: hrms

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hrms_db
      MYSQL_USER: ${HRMS_DATASOURCE_USERNAME:-hrms}
      MYSQL_PASSWORD: ${HRMS_DATASOURCE_PASSWORD:-hrms}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:

networks:
  default:
    name: hrms-network
