name: CI - Backend (build & test)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  JAVA_VERSION: "21"

jobs:
  build-and-test:
    name: mvn build+test (core, a2a, all agents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Build the WHOLE reactor once: it's a multi-module SNAPSHOT project so
      # every agent needs core+a2a installed into the local .m2 repo first.
      - name: Build & unit test full reactor
        run: mvn -B -ntp clean verify -DskipITs
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Upload built jars (consumed by CD workflow)
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          retention-days: 3
          path: |
            auth-service/target/*.jar
            mcp-server/target/*.jar
            orchestrator-agent/target/*.jar
            hr-agent/target/*.jar
            employee-agent/target/*.jar
            attendance-agent/target/*.jar
            payroll-agent/target/*.jar
            manager-agent/target/*.jar
            leave-agent/target/*.jar
            document-agent/target/*.jar
            notification-agent/target/*.jar
            policy-agent/target/*.jar
            expense-agent/target/*.jar
            asset-agent/target/*.jar
            performance-agent/target/*.jar
            recruitment-agent/target/*.jar
            audit-agent/target/*.jar
            compliance-agent/target/*.jar
            workflow-agent/target/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar

  checkstyle:
    name: License / checkstyle checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -ntp checkstyle:check
