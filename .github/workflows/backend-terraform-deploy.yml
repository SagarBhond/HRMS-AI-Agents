name: Backend Terraform Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "${{ secrets.AWS_ROLE_ARN }}" || { echo "AWS_ROLE_ARN is missing"; exit 1; }
          test -n "${{ secrets.DB_PASSWORD }}" || { echo "DB_PASSWORD is missing"; exit 1; }
          test -n "${{ secrets.GOOGLE_API_KEY }}" || { echo "GOOGLE_API_KEY is missing"; exit 1; }
          test -n "${{ secrets.JWT_SECRET }}" || { echo "JWT_SECRET is missing"; exit 1; }

          if [ ${#DB_PASSWORD} -lt 8 ]; then
            echo "DB_PASSWORD must be at least 8 characters long for AWS RDS."
            exit 1
          fi
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Terraform init
        run: |
          cd terraform
          terraform init

      - name: Terraform apply
        run: |
          cd terraform
          terraform apply -auto-approve \
            -var="aws_region=${{ secrets.AWS_REGION || env.AWS_REGION }}" \
            -var="db_name=${{ secrets.DB_NAME || 'hrms_db' }}" \
            -var="db_username=${{ secrets.DB_USERNAME || 'hrms' }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="google_api_key=${{ secrets.GOOGLE_API_KEY }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="github_org=${{ github.repository_owner }}" \
            -var="github_repo=${{ github.event.repository.name }}" \
            -var="github_branch=${{ github.ref_name }}"
