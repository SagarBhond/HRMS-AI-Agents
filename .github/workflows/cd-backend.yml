name: CD - Backend (build, push to ECR, deploy to ECS)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated services to deploy (blank = all 19)"
        required: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  ECS_CLUSTER: hrms

jobs:
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: mcp,          dockerfile: mcp-server/Dockerfile,          port: 8082 }
          - { service: auth,         dockerfile: auth-service/Dockerfile,       port: 8081 }
          - { service: backend,      dockerfile: Dockerfile,                   port: 8080, app_module: orchestrator-agent }
          - { service: hr,           dockerfile: hr-agent/Dockerfile,           port: 8088 }
          - { service: employee,     dockerfile: employee-agent/Dockerfile,     port: 8083 }
          - { service: attendance,   dockerfile: attendance-agent/Dockerfile,   port: 8084 }
          - { service: payroll,      dockerfile: payroll-agent/Dockerfile,      port: 8085 }
          - { service: manager,      dockerfile: manager-agent/Dockerfile,      port: 8086 }
          - { service: leave,        dockerfile: leave-agent/Dockerfile,        port: 8087 }
          - { service: document,     dockerfile: document-agent/Dockerfile,     port: 8089 }
          - { service: notification, dockerfile: notification-agent/Dockerfile, port: 8090 }
          - { service: policy,       dockerfile: policy-agent/Dockerfile,       port: 8091 }
          - { service: expense,      dockerfile: expense-agent/Dockerfile,      port: 8092 }
          - { service: asset,        dockerfile: asset-agent/Dockerfile,        port: 8093 }
          - { service: performance,  dockerfile: performance-agent/Dockerfile,  port: 8094 }
          - { service: recruitment,  dockerfile: recruitment-agent/Dockerfile,  port: 8095 }
          - { service: audit,        dockerfile: audit-agent/Dockerfile,        port: 8096 }
          - { service: compliance,   dockerfile: compliance-agent/Dockerfile,   port: 8097 }
          - { service: workflow,     dockerfile: workflow-agent/Dockerfile,     port: 8098 }
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            APP_MODULE=${{ matrix.app_module || matrix.service }}
            SERVICE=${{ matrix.service }}
            SERVICE_PORT=${{ matrix.port }}
          tags: |
            ${{ env.ECR_REGISTRY }}/hrms/${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/hrms/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service hrms-${{ matrix.service }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

  smoke-test:
    name: Post-deploy smoke test
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Hit orchestrator health endpoint
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "${{ secrets.ORCHESTRATOR_PUBLIC_URL }}/actuator/health"; then
              echo "Healthy"; exit 0
            fi
            echo "Not ready yet, retrying..."; sleep 15
          done
          echo "Service failed health check after deploy" && exit 1
