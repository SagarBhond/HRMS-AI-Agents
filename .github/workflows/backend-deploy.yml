name: Backend CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  ECS_CLUSTER: hrms

jobs:
  build-and-test:
    name: Build and test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test Maven reactor
        run: mvn -B -ntp clean verify -DskipITs

  build-push-deploy:
    name: Build, push, and deploy ${{ matrix.service }}
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: mcp, dockerfile: mcp-server/Dockerfile }
          - { service: auth, dockerfile: auth-service/Dockerfile }
          - { service: backend, dockerfile: Dockerfile, app_module: orchestrator-agent }
          - { service: hr, dockerfile: Dockerfile, app_module: hr-agent }
          - { service: employee, dockerfile: Dockerfile, app_module: employee-agent }
          - { service: attendance, dockerfile: Dockerfile, app_module: attendance-agent }
          - { service: payroll, dockerfile: Dockerfile, app_module: payroll-agent }
          - { service: manager, dockerfile: Dockerfile, app_module: manager-agent }
          - { service: leave, dockerfile: Dockerfile, app_module: leave-agent }
          - { service: document, dockerfile: Dockerfile, app_module: document-agent }
          - { service: notification, dockerfile: Dockerfile, app_module: notification-agent }
          - { service: policy, dockerfile: Dockerfile, app_module: policy-agent }
          - { service: expense, dockerfile: Dockerfile, app_module: expense-agent }
          - { service: asset, dockerfile: Dockerfile, app_module: asset-agent }
          - { service: performance, dockerfile: Dockerfile, app_module: performance-agent }
          - { service: recruitment, dockerfile: Dockerfile, app_module: recruitment-agent }
          - { service: audit, dockerfile: Dockerfile, app_module: audit-agent }
          - { service: compliance, dockerfile: Dockerfile, app_module: compliance-agent }
          - { service: workflow, dockerfile: Dockerfile, app_module: workflow-agent }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::882040517001:role/hrms-backend-github-actions
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: APP_MODULE=${{ matrix.app_module || matrix.service }}
          tags: |
            ${{ env.ECR_REGISTRY }}/hrms/${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/hrms/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Force ECS deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "hrms-${{ matrix.service }}" \
            --force-new-deployment \
            --region "$AWS_REGION"

  smoke-test:
    name: Backend smoke test
    needs: build-push-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check orchestrator health
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "${{ secrets.ORCHESTRATOR_PUBLIC_URL }}/actuator/health"; then
              exit 0
            fi
            sleep 15
          done
          exit 1
