spring:
  application:
    name: compliance-agent
server:
  port: ${COMPLIANCE_AGENT_PORT:8097}
shrija:
  ai:
    gemini-api-key: ${GOOGLE_API_KEY}
    gemini-model: ${COMPLIANCE_GEMINI_MODEL:gemini-3.1-flash-lite}
    mcp-server-url: ${COMPLIANCE_MCP_SERVER_URL:http://localhost:8082}
ai:
  a2a:
    server:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    com.shrija.compliance: INFO
    com.google.adk: INFO
