spring:
  application:
    name: performance-agent
server:
  port: ${PERFORMANCE_AGENT_PORT:8094}
shrija:
  ai:
    gemini-api-key: ${GOOGLE_API_KEY}
    gemini-model: ${PERFORMANCE_GEMINI_MODEL:gemini-3.1-flash-lite}
    mcp-server-url: ${PERFORMANCE_MCP_SERVER_URL:http://localhost:8082}
ai:
  a2a:
    server:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    com.shrija.performance: INFO
    com.google.adk: INFO
