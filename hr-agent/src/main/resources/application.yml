spring:
  application:
    name: hr-agent

server:
  port: ${HR_AGENT_PORT:8088}

shrija:
  ai:
    gemini-api-key: ${GOOGLE_API_KEY}
    gemini-model: ${HR_GEMINI_MODEL:gemini-3.1-flash-lite}
    mcp-server-url: ${HR_MCP_SERVER_URL:http://localhost:8082}
    payroll-agent-url: ${PAYROLL_AGENT_A2A_URL:http://localhost:8085}
    budget-agent-url: ${BUDGET_AGENT_A2A_URL:}
    document-agent-url: ${DOCUMENT_AGENT_A2A_URL:http://localhost:8089}
    orchestration-agent-url: ${ORCHESTRATOR_AGENT_PORT:8080}
    recruitment-agent-url: ${RECRUITMENT_AGENT_PORT:8080}
    employee-agent-url: ${EMPLOYEE_AGENT_PORT:8083}
    manager-agent-url: ${MANAGER_AGENT_PORT:8086}

# Enables the embedded A2A server so hr-agent is itself discoverable/callable over A2A.
ai:
  a2a:
    server:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.shrija.hr: INFO
    com.google.adk: INFO
